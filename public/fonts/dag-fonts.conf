<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  DAG 缩图渲染专用 fontconfig（2026-09-20 CJK 豆腐方框修复）。

  问题：Vercel serverless 执行环境完全没有字型（实测 fc-list=0、
  /usr/share/fonts 不存在），librsvg 渲染任何文字都变豆腐方框。
  本机正常纯属 fontconfig 系统字型的侥幸——本地/生产不一致的典型。

  解法：字型档随程式码部署（src/lib/fonts/NotoSansCJKsc-subset.otf，
  Noto Sans CJK SC 子集，常用汉字全覆盖，5MB），本档让 fontconfig
  只看这一个目录。sharp 启动时以 FONTCONFIG_FILE=<本档路径> 指进来。

  字型覆盖范围（子集化时的取舍，见 git 历史的生成脚本说明）：
  - ASCII 全部 + CJK 常用汉字（U+4E00–U+9FA5）+ CJK 标点 + 全形符号 + 箭头
  - 模板标题四十余条全数验证在覆盖内
  - 动态 title 若出现罕用字 → 落到 notdef 方框（可接受：缩图非正文）
-->
<fontconfig>
  <dir>__FONT_DIR__</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <!-- sans-serif 别名收敛到唯一可用字型：任何 font-family 最终都命中它 -->
  <match target="pattern">
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
</fontconfig>
