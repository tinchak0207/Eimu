<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  DAG 縮圖渲染專用 fontconfig（2026-09-20 CJK 豆腐方框修復）。

  問題：Vercel serverless 執行環境完全沒有字型（實測 fc-list=0、
  /usr/share/fonts 不存在），librsvg 渲染任何文字都變豆腐方框。
  本機正常純屬 fontconfig 系統字型的僥倖——本地/生產不一致的典型。

  解法：字型檔隨程式碼部署（src/lib/fonts/NotoSansCJKsc-subset.otf，
  Noto Sans CJK SC 子集，常用漢字全覆蓋，5MB），本檔讓 fontconfig
  只看這一個目錄。sharp 啟動時以 FONTCONFIG_FILE=<本檔路徑> 指進來。

  字型覆蓋範圍（子集化時的取捨，見 git 歷史的生成腳本說明）：
  - ASCII 全部 + CJK 常用漢字（U+4E00–U+9FA5）+ CJK 標點 + 全形符號 + 箭頭
  - 模板標題四十餘條全數驗證在覆蓋內
  - 動態 title 若出現罕用字 → 落到 notdef 方框（可接受：縮圖非正文）
-->
<fontconfig>
  <dir>__FONT_DIR__</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <!-- sans-serif 別名收斂到唯一可用字型：任何 font-family 最終都命中它 -->
  <match target="pattern">
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
</fontconfig>
