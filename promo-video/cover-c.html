<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Eimu · B站封面 C（汇聚）</title>
<style>
@font-face { font-family: "Geist"; src: url(../src/app/fonts/GeistVF.woff) format("woff"); font-weight: 100 900; }
@font-face { font-family: "GeistMono"; src: url(../src/app/fonts/GeistMonoVF.woff) format("woff"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { position: relative; font-family: "Geist", "Noto Sans CJK SC", sans-serif; -webkit-font-smoothing: antialiased;
  background: url(out/bgC2.png) center / cover no-repeat; }
/* 左上柔光：让文字下方的画布更干净（不改变节点本体） */
.scrim { position: absolute; inset: 0; background:
  radial-gradient(1300px 420px at 62% 18%, rgba(242,245,250,.6), rgba(242,245,250,.2) 55%, transparent 80%); }
.brand { position: absolute; left: 294px; top: 96px; display: flex; align-items: center; gap: 18px; height: 70px; padding: 0 30px 0 26px; border-radius: 99px;
  background: rgba(255,255,255,.66); border: 1.5px solid rgba(255,255,255,.95); box-shadow: 0 14px 34px rgba(45,49,66,.10), inset 0 1.5px 0 #fff; backdrop-filter: blur(20px); }
.brand b { font: 700 38px "Geist"; letter-spacing: -.03em; color: #141824; }
.brand span { width: 2px; height: 28px; background: rgba(27,32,48,.18); }
.brand em { font: 500 25px "Noto Sans CJK SC"; font-style: normal; color: #4d5670; letter-spacing: .06em; }
.h { position: absolute; left: 820px; font-family: "Noto Sans CJK SC"; font-weight: 900; letter-spacing: -.02em; line-height: 1; white-space: nowrap; }
.h1 { top: 92px; font-size: 128px; color: #111624; }
.h1 .n { font-family: "Geist"; font-weight: 800; letter-spacing: -.045em; }
.h2 { top: 238px; font-size: 128px; letter-spacing: -.01em; background: linear-gradient(95deg, #2f7bff 0%, #6a6cf5 45%, #ec4d92 100%); -webkit-background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(244,246,250,.95)) drop-shadow(0 0 6px rgba(244,246,250,.9)); }
.h2 .n { font-family: "Geist"; font-weight: 800; letter-spacing: -.04em; }
.prompt { position: absolute; left: 294px; top: 506px; height: 72px; border-radius: 99px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.7)); border: 1.5px solid rgba(255,255,255,.98);
  box-shadow: 0 22px 50px rgba(45,49,66,.16), 0 4px 12px rgba(45,49,66,.06), inset 0 2px 0 #fff; backdrop-filter: blur(24px) saturate(180%); }
.prompt .q { font: 600 30px "Noto Sans CJK SC"; color: #141824; white-space: nowrap; }
.prompt .send { width: 50px; height: 50px; border-radius: 50%; background: #2d3142; display: grid; place-items: center; box-shadow: 0 10px 22px rgba(45,49,66,.26); }
</style>
</head>
<body>
<div class="scrim"></div>
<div class="brand"><b>Eimu</b><span></span><em>许愿式 AI 影像工作台</em></div>
<div class="h h1"><span class="n">21</span> 个节点</div>
<div class="h h2">汇成一部电影</div>
</body>
</html>
