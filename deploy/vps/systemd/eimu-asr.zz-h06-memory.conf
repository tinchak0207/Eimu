# Install: /etc/systemd/system/eimu-asr.service.d/zz-h06-memory.conf
# Named zz-* so it sorts after oom.conf (drop-ins merge by filename; the later one wins).
#
# Evidence (2026-11-03 03:10-03:50 CST swap storm): eimu-asr sat at its 600M MemoryMax
# with unlimited swap and reached a 697M swap peak, ~1.3G anon on a 3.7G box. Together
# with the gateway (1.8G swap peak) and warp-svc (725M swap peak) that pushed the host
# to 64.8% iowait and ~4.5k majflt/s until an operator stopped services by hand.
#
# RAM: measured peak 600M (clamped) -> 640M ceiling, start reclaiming at 560M.
# Swap: capped below the storm peak on purpose. ASR is a restartable batch worker
# (OOMScoreAdjust=200); a memcg OOM in ASR is cheaper than dragging the whole host
# into swap. Rollback: rm this file && systemctl daemon-reload.
[Service]
MemoryHigh=560M
MemoryMax=640M
MemorySwapMax=384M
