# 保護助理大腦 opencode-server：全域 OOM 時優先殺別人（2026-10-02 08:36 OOM 事故治本）
# 2026-10-17：補 MemoryMax —— 僅 OOMScoreAdjust/-500+MemoryMin 挡不住全局 OOM（opencode 曾涨到 2.5GiB）
# 2026-10-17 晚：1500M 顶满后 swap thrash → 子代理 prompt_async 10s 超时/502；抬到 1800M 并配合 takeover 退避
# 部署：複製本檔到 /etc/systemd/system/opencode-server.service.d/oom.conf
#       systemctl daemon-reload && systemctl restart opencode-server
# StartLimit 属于 [Unit]；RestartSec 属于 [Service]。不改 ExecStart。
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
RestartSec=10s
OOMScoreAdjust=-500
MemoryMin=200M
MemoryMax=1800M
# MemoryMax 只限制物理内存。不设 MemorySwapMax 时，超出部分进入主机 swap，4GB 机器被这一个进程换死。
MemorySwapMax=0
