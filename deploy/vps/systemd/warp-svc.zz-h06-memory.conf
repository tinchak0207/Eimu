# Install: /etc/systemd/system/warp-svc.service.d/zz-h06-memory.conf
#
# Evidence: warp-svc had no memory limit, 458M RAM peak and 725M swap peak, and its
# DEBUG logging is ~70% of all journal lines (5239 of ~7500 in 2h on 2026-11-03).
# Limits leave headroom over both peaks (RAM 458M -> High 640M / Max 900M; swap
# 725M peak was mostly global-pressure swap-out, capped at 512M). Restart=always is
# the vendor default, so a memcg OOM here is a short tunnel blip, not a dead tunnel.
# LogLevelMax only applies after the next warp-svc restart (not forced by this change).
# Rollback: rm this file && systemctl daemon-reload.
[Service]
MemoryHigh=640M
MemoryMax=900M
MemorySwapMax=512M
LogLevelMax=info
