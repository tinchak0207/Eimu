# 限制 eimu-asr（词级 ASR）吃内存/swap，保护 opencode-server 大脑（止血 2026-10-18）
# 现场：eimu-asr.service，MemoryMax=infinity、OOMScoreAdjust=0；
#       空闲 RSS≈8MB 但 VmSwap≈501MB（模型被换出）；10-14..16 曾被 OOM 杀多次。
# 历史载入 RSS≈333MB（small 模型）；取 MemoryMax=600M 留推理余量。
# OOMScoreAdjust=+200 > opencode(-500)：全局 OOM 时优先杀 ASR，保护大脑。
# 部署：复制本档到 /etc/systemd/system/eimu-asr.service.d/oom.conf
#       systemctl daemon-reload && systemctl restart eimu-asr
# （本轮只入库真源，不在生产 restart）
[Service]
OOMScoreAdjust=200
MemoryMax=600M
