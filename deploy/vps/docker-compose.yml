services:
  nextjs:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: imagesite-nextjs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - ./app/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - new-api
    networks:
      - imagesite

  generation-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: generation-worker
    container_name: imagesite-generation-worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - ./app/.env.production
    environment:
      NODE_ENV: production
    networks:
      - imagesite

  new-api:
    image: calciumion/new-api:latest
    container_name: imagesite-new-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      PORT: 3001
      TZ: Asia/Hong_Kong
      SESSION_SECRET: ${NEW_API_SESSION_SECRET}
    volumes:
      - ./new-api-data:/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - imagesite

  nginx:
    image: nginx:1.27-alpine
    container_name: imagesite-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - nextjs
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # [downloads 2026-10-05] Eimu 桌面版安装包静态目录（宿主 ./nginx/downloads），
      # 供 conf.d 内 `location ^~ /downloads/` 直发，见 nginx/default.conf。
      - ./nginx/downloads:/usr/share/nginx/downloads:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - imagesite

  certbot:
    image: certbot/certbot:latest
    container_name: imagesite-certbot
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    profiles:
      - manual
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - imagesite

networks:
  imagesite:
    driver: bridge
