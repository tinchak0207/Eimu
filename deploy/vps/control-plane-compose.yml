# 模板，不是现役档。现役真源＝VPS /opt/image-control-plane/control-plane-compose.yml
# （api/worker 另有 PIXAI_BASE_URL/PIXAI_API_KEY 明文 env，secret 不入 git）。
# deploy/vps/deploy-control-plane.sh 永不覆写 VPS compose，只比对键名漂移。
services:
  generation-postgres:
    image: postgres:16-alpine
    container_name: image-control-postgres
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - ./.env.control-plane
    environment:
      POSTGRES_DB: image_control
      POSTGRES_USER: image_control
      POSTGRES_PASSWORD: ${GENERATION_POSTGRES_PASSWORD}
    volumes:
      - ./generation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U image_control -d image_control"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - imagesite

  generation-api:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner
    container_name: image-control-api
    # 冻结镜像没有 a6api 渠道，且 directVideoPrompt 会改写 H3 官方 Content IR。
    # 容器以 root 启动，先把宿主上的增量写进正在执行的 chunk，再降权到 nextjs。
    # 镜像本身已含增量时脚本空操作。
    user: "0:0"
    volumes:
      - /opt/image-control-plane/runtime-delta:/runtime-delta:ro
    entrypoint: ["/runtime-delta/start-api.sh"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - ./.env.control-plane
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # OpenAI 同步兼容层（/openai/v1/*）由本容器承载：提交与轮询直连本机 3000，
      # 免绕回公开域（绕回会命中 nginx 的 /image-control/ 前缀，路径对不上）。
      OPENAI_COMPAT_GENERATION_ORIGIN: http://127.0.0.1:3000
    depends_on:
      generation-postgres:
        condition: service_healthy
    networks:
      - imagesite

  generation-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: generation-worker
    container_name: image-control-worker
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - ./.env.control-plane
    volumes:
      - ./.env.control-plane:/app/.env.control-plane
      - /opt/filmera-accounts:/opt/filmera-accounts
    environment:
      FILMERA_ENV_PATH: /app/.env.control-plane
      NODE_ENV: production
      # 2026-10-20 压测：默认 6 会让 30 张图排成 5 分钟级；上游实测可承受 12 路。
      # 同时必须把 supplier/account/capability 三层 concurrency_limit 一起提到 12。
      GENERATION_WORKER_CONCURRENCY: "12"
    depends_on:
      generation-postgres:
        condition: service_healthy
    networks:
      - imagesite

networks:
  imagesite:
    external: true
    name: imagesite_imagesite

