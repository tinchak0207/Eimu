# Install: /etc/systemd/journald.conf.d/60-eimu.conf  (then: systemctl restart systemd-journald)
# Base journald.conf already has SystemMaxUse=100M. Keep a bit more history so an
# overnight incident is still in the journal the next day, but always leave 1G free
# on the 59G root disk. disk-guard no longer vacuums to 50M unless the disk is critical.
# Rollback: rm this file && systemctl restart systemd-journald.
[Journal]
SystemMaxUse=150M
SystemKeepFree=1G
MaxRetentionSec=14day
