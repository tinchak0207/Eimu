# ---------------- default_server :80 (bare IP / unmatched Host) ----------------
# Vercel serverless calls this over plaintext HTTP (GATEWAY_BASE_URL=http://<ip>).
# Only the API surface is exposed; every other path is dropped with 444 so that
# new-api no longer answers 200 (SPA shell) to /.env, /wp-config.php, etc.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    gzip on;
    gzip_types application/json text/css application/javascript text/javascript application/x-javascript text/plain text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ^~ /market-api/ {
        rewrite ^/market-api/?(.*)$ /$1 break;
        proxy_pass http://market-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # new-api management/provisioning API (used by the Vercel serverless gateway)
    location ^~ /api/ {
        proxy_pass http://new-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # new-api OpenAI/Anthropic-compatible relay (token-authenticated)
    location ^~ /v1/ {
        proxy_pass http://new-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
    }

    # everything else (incl. the new-api web console) is not served here
    location / {
        return 444;
    }
}

# ---------------- default_server :443 (unmatched SNI / bare IP over TLS) ----------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/store.tinchak0207.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.tinchak0207.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 444;
}
