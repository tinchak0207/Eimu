# ============================================================
#  imagesite nginx  --  revised 2026-07-26 (claude2)
#  - gzip enabled per-server (nginx.conf is the alpine stock file, not mounted)
#  - generation endpoints: long timeouts + unbuffered streaming
#  - store/market port 80 -> forced HTTPS (acme-challenge excepted)
#  - default_server exposes ONLY the gateway API surface, else 444
#  - firefly: two relay workers (firefly-relay@1/@2, ports 18432/18433),
#    least_conn so a long 2K render on one worker doesn't queue the other
# ============================================================

upstream firefly_relay_pool {
    least_conn;
    # max_fails/fail_timeout: a worker whose Adobe session dies (shared-account kick)
    # gets benched for 30s instead of eating every other request.
    server host.docker.internal:18432 max_fails=2 fail_timeout=30s;
    server host.docker.internal:18433 max_fails=2 fail_timeout=30s;
}

limit_req_zone $binary_remote_addr zone=adobe_pair:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=adobe_sync:10m rate=30r/m;

# ---------------- store.tinchak0207.xyz : HTTP -> HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name store.tinchak0207.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------- store.tinchak0207.xyz : HTTPS ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name store.tinchak0207.xyz;

    ssl_certificate /etc/letsencrypt/live/store.tinchak0207.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.tinchak0207.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    gzip on;
    gzip_types application/json text/css application/javascript text/javascript application/x-javascript text/plain text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    location ^~ /sub2api-admin/ { return 444; }

    location ^~ /sub2api/v1/ {
        proxy_pass http://sub2api-vps:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # [downloads 2026-10-05] Eimu 桌面版安装包静态分发。原先托管在 Vercel Blob
    # （store GFy3GwthV6OA8bB7），2026-10-05 被平台封锁（403 "Your store is blocked"）
    # ⇒ 改由本机 nginx 直发。宿主目录 /opt/imagesite/nginx/downloads，只读挂进
    # /usr/share/nginx/downloads（见 docker-compose.yml 的 nginx.volumes）。
    # default_type + Content-Disposition：tar.gz 不在 mime.types 内，强制 attachment
    # 让点击即下载、不离开页面；electron-updater 取 latest*.yml 亦不受影响。
    # Range 由 nginx 静态模组原生支援，electron-updater 的多段 Range 差分下载在此生效。
    location ^~ /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Disposition "attachment" always;
        gzip off;
    }

    location ^~ /pixai/v1/ {
        proxy_pass http://pixai-bridge:18090/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
    }

    location /image-api/v1/ {
        proxy_pass http://chatgpt2api-test/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
    }

    location = /adobe-sync {
        limit_req zone=adobe_sync burst=5 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Cache-Control "no-store" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://adobe2api:6001/api/v1/browser-cookie-sync;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_buffering off;
    }

    location = /adobe-sync/pair {
        limit_req zone=adobe_pair burst=3 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "no-store" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://adobe2api:6001/api/v1/browser-cookie-sync/pair;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location ^~ /adobe2api/ {
        add_header Access-Control-Allow-Origin "https://image.tinchak0207.xyz" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        rewrite ^/adobe2api/(.*)$ /$1 break;
        proxy_pass http://adobe2api:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
    }

    # VPS-backed blob replacement (postgres kv + static files) for image-studio.
    # CORS block mirrors the live conf on the VPS (2026-09-06 backport): the
    # origin allowlist is eimu.dev / image.tinchak0207.xyz, and Vary: Origin
    # keeps cached variants distinct for browsers that honor it.
    location ^~ /image-data/ {
        if ($http_origin ~* ^https://(www\.)?(eimu\.dev|image\.tinchak0207\.xyz)$) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range, Content-Type' always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
        }
        if ($request_method = OPTIONS) { return 204; }
        rewrite ^/image-data/(.*)$ /$1 break;
        proxy_pass http://image-data-api:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        client_max_body_size 30m;
    }

    location ^~ /firefly-relay/ {
        rewrite ^/firefly-relay/(.*)$ /$1 break;
        proxy_pass http://firefly_relay_pool;
        # Retry the other worker on connection errors (dead worker -> RST) only.
        # NOT "timeout": in nginx that includes read timeouts, so a >180s render would be
        # re-submitted to the other worker and burn Adobe credits twice.
        proxy_next_upstream error;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
    }

    # Read-only Gatus status data for the public image status page.
    # [redteam 2026-10-05] 收窄：原 `^~ /gatus-api/` 前缀会把 Gatus 整个 /api/v1/*
    # 管理面（/gatus-api/config、/gatus-api/endpoints/<key>/statuses 等）放给公网
    # （Gatus 配置没有 security 段）。此处只放行状态页唯一消费的精确路径，
    # 其余 /gatus-api/* 一律 404。
    location = /gatus-api/endpoints/statuses {
        limit_except GET { deny all; }
        rewrite ^/gatus-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://image-gatus:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /gatus-api/ {
        return 404;
    }

    location / {
        proxy_pass http://store-backend:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        # the SPA bundle is ~220 KB; keep it in memory instead of proxy_temp on disk
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
    }
}

