services:
  gatus:
    image: ghcr.io/twin/gatus:stable
    container_name: image-gatus
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3002:8080"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    networks:
      - imagesite

networks:
  imagesite:
    external: true
    name: imagesite_imagesite
