storage:
  type: sqlite
  path: /data/gatus.db
  maximum-number-of-results: 1500
  maximum-number-of-events: 100

ui:
  title: Image API Status
  header: Image API Status
  default-sort-by: group

endpoints:
  # /v1/images/generations 是异步接口，POST 回 202 不代表 worker 或数据库活着。
  # 改打控制面就绪探针。告警外发未配置密钥，见文件末尾注释，不打开。
  - name: 控制面就绪
    group: Production
    url: https://store.tinchak0207.xyz/image-control/api/readyz
    method: GET
    interval: 15m
    client:
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

  # 生图链路端到端探针：此前只在 VPS 上存在，repo 没有 ⇒ 单向覆盖会冲掉它。
  # 2026-10-24 依「双向 diff 取并集」并回 repo，之后两边同源。
  - name: Gemini 3.1 Flash Image - 1K generation
    group: Production
    url: https://image.tinchak0207.xyz/v1/images/generations
    method: POST
    interval: 2h
    headers:
      Authorization: "Bearer ${IMAGE_API_KEY}"
      Content-Type: application/json
    body: |
      {"model":"gemini-3.1-flash-image","prompt":"Uptime monitor probe. Create a single minimal blue square on a white background.","size":"1024x1024","n":1,"routing_hint":"hub"}
    client:
      timeout: 10m
    conditions:
      # production 的 /v1/images/generations 是非同步 API：POST 一律回 202 + task body。
      # 探測必須驗證「202 + task id 存在」，而不是寬鬆的 2xx——否則卡 202 也算成功。
      # routing_hint=hub → 調度器固定走 hublinuxdo 渠道。
      - "[STATUS] == 202"
      - "[BODY].id != \"\""
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false
      badge:
        response-time:
          thresholds: [10000, 30000, 60000, 120000, 300000]

  - name: Agent 网关健康
    group: Production
    url: https://store.tinchak0207.xyz/agent/healthz
    method: GET
    interval: 15m
    client:
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

  # VPS 根分割区容量。2026-10-24 盘写满 100% 导致 postgres 无限重启、
  # agent key relay 全挂；当时没有任何探针看容量，靠用户截图才发现。
  # 数值由 VPS 上 disk-metrics.timer 每 5 分钟写入 /var/www/certbot/diskz.json
  # （disk-guard.timer 负责在低位回收），nginx 以 /risk/diskz.json 对本机与内网暴露。
  # 走容器名直连 imagesite-nginx，避免绕到公网再被 deny 规则挡回。
  - name: VPS 磁盘容量
    group: Production
    url: http://imagesite-nginx/risk/diskz.json
    method: GET
    interval: 5m
    client:
      timeout: 15s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
      - "[BODY].freePercent >= 15"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

  # 风控绊线（金丝雀／异常注册）：此前只存在于 VPS `/opt/image-gatus/config/config.yaml`，
  # repo 没有这一段 ⇒ 拿 repo 单向覆盖会把它整条冲掉。2026-10-04 依「双向 diff 取并集」
  # 并回 repo，repo 从此是两条探针的唯一天源。
  - name: 风控绊线（金丝雀/异常注册）
    group: Risk
    url: https://store.tinchak0207.xyz/risk/status.json
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].alert == false"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

  # 付款对帐探针：用支付商自己的资料对帐「已付款 vs 已履约」。
  # 端点由控制面承载（需要控制面 DB + 支付商凭证），故走 /image-control/ 前缀
  # （与 deploy/vps/deploy-control-plane.sh 的 PUBLIC_HEALTHZ 同一族）。
  # 有 paid_unfulfilled > 0（付了钱没履约）→ 端点回 503 → 探针红灯；这正是不许
  # 用假 200 假装健康的那条。修好前刻意红著，逼履约。
  - name: mPay 付款对帐（已付款 vs 已履约）
    group: Production
    url: https://store.tinchak0207.xyz/image-control/api/payments/mapay/health
    interval: 30m
    client:
      timeout: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].paid_unfulfilled == 0"
      - "[BODY].configured == true"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

# 告警密钥未配置，外发保持关闭。不要在仓库里写 Telegram token。
# alerting:
