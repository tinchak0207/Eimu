storage:
  type: sqlite
  path: /data/gatus.db
  maximum-number-of-results: 1500
  maximum-number-of-events: 100

ui:
  title: Image API Status
  header: Image API Status
  default-sort-by: group

endpoints:
  # /v1/images/generations 是异步接口，POST 回 202 不代表 worker 或数据库活着。
  # 改打控制面就绪探针。告警外发未配置密钥，见文件末尾注释，不打开。
  - name: 控制面就绪
    group: Production
    url: https://store.eimu.dev/image-control/api/readyz
    method: GET
    interval: 15m
    client:
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

  - name: Agent 网关健康
    group: Production
    url: https://store.eimu.dev/agent/healthz
    method: GET
    interval: 15m
    client:
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

  # 风控绊线（金丝雀／异常注册）：此前只存在于 VPS `/opt/image-gatus/config/config.yaml`，
  # repo 没有这一段 ⇒ 拿 repo 单向覆盖会把它整条冲掉。2026-10-04 依「双向 diff 取并集」
  # 并回 repo，repo 从此是两条探针的唯一天源。
  - name: 风控绊线（金丝雀/异常注册）
    group: Risk
    url: https://store.eimu.dev/risk/status.json
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].alert == false"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

  # 付款对帐探针：用支付商自己的资料对帐「已付款 vs 已履约」。
  # 端点由控制面承载（需要控制面 DB + 支付商凭证），故走 /image-control/ 前缀
  # （与 deploy/vps/deploy-control-plane.sh 的 PUBLIC_HEALTHZ 同一族）。
  # 有 paid_unfulfilled > 0（付了钱没履约）→ 端点回 503 → 探针红灯；这正是不许
  # 用假 200 假装健康的那条。修好前刻意红著，逼履约。
  - name: mPay 付款对帐（已付款 vs 已履约）
    group: Production
    url: https://store.eimu.dev/image-control/api/payments/mapay/health
    interval: 30m
    client:
      timeout: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].paid_unfulfilled == 0"
      - "[BODY].configured == true"
    ui:
      hide-hostname: true
      hide-port: true
      hide-errors: false

# 告警密钥未配置，外发保持关闭。不要在仓库里写 Telegram token。
# alerting:
#   telegram:
#     token: "${TELEGRAM_BOT_TOKEN}"
#     id: "${TELEGRAM_CHAT_ID}"
