<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Launch Campaign</title><style>
:root{--duration:15s;font-family:Inter,ui-sans-serif,system-ui}*{box-sizing:border-box}body{margin:0;background:#05060a;display:grid;place-items:center;min-height:100vh}.stage{position:relative;width:min(56.25vh,100vw);aspect-ratio:1080/1350;overflow:hidden;color:#ffffff;background:linear-gradient(145deg,#080a12,#6d28d9);box-shadow:0 40px 100px #0009}.stage:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 80% 20%,#b7ff4a88,transparent 45%);animation:drift var(--duration) ease-in-out infinite alternate}.frame{position:absolute;inset:8%;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(5%);animation-duration:var(--duration);animation-timing-function:linear;animation-iteration-count:infinite}.kicker{font-size:clamp(12px,2.4vh,28px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#b7ff4a}h2{font-size:clamp(36px,8vh,96px);line-height:.95;letter-spacing:-.05em;margin:.25em 0;max-width:10ch}p{font-size:clamp(17px,3vh,36px);line-height:1.2;max-width:22ch;color:#ffffffe0}span{align-self:flex-start;margin-top:1em;padding:.65em 1em;border-radius:999px;background:#b7ff4a;color:#080a12;font-size:clamp(16px,2.5vh,30px);font-weight:800}@keyframes drift{to{transform:translate(-8%,7%) scale(1.08)}}@keyframes scene-0{0%,0.000%{opacity:0;transform:translateY(5%)}1.500%,18.500%{opacity:1;transform:none}20.000%,100%{opacity:0;transform:translateY(-3%)}}@keyframes scene-1{0%,20.000%{opacity:0;transform:translateY(5%)}21.500%,51.833%{opacity:1;transform:none}53.333%,100%{opacity:0;transform:translateY(-3%)}}@keyframes scene-2{0%,53.333%{opacity:0;transform:translateY(5%)}54.833%,78.500%{opacity:1;transform:none}80.000%,100%{opacity:0;transform:translateY(-3%)}}@keyframes scene-3{0%,80.000%{opacity:0;transform:translateY(5%)}81.500%,98.500%{opacity:1;transform:none}100.000%,100%{opacity:0;transform:translateY(-3%)}}</style></head><body><main class="stage"><section class="frame" style="animation-name:scene-0"><div class="kicker">Most launches</div><h2>Disappear in the scroll.</h2><p>Not because the product is bad.</p></section><section class="frame" style="animation-name:scene-1"><div class="kicker">The real problem</div><h2>Nobody gets it fast enough.</h2><p>Signal finds the message and proof gaps.</p></section><section class="frame" style="animation-name:scene-2"><div class="kicker">Before launch</div><h2>See every risk on one screen.</h2><p>Then fix what actually matters.</p></section><section class="frame" style="animation-name:scene-3"><div class="kicker">Signal</div><h2>Launch with clarity.</h2><p></p><span>Run the audit</span></section></main></body></html>
