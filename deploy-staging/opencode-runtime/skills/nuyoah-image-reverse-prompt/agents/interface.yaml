interface:
  display_name: "南鸢图片反推"
  short_description: "拆解参考图并输出可直接复制的中文生图提示词"
  default_prompt: "使用 $nuyoah-image-reverse-prompt 拆解这张参考图，输出画面结构词、参考色卡和可直接复制生成的完整中文提示词。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
